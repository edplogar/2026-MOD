    <script>
      // Suppress and intercept harmless Vite HMR WebSocket closing events in AI Studio preview environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            var protoStr = typeof protocols === 'string' ? protocols : Array.isArray(protocols) ? protocols.join(' ') : '';
            var urlStr = String(url || '');
            if (protoStr.indexOf('vite') !== -1 || urlStr.indexOf('token=') !== -1 || urlStr.indexOf('vite-ping') !== -1) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var target = new EventTarget();
              var dummySocket = {
                url: urlStr,
                protocol: protoStr,
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                },
                send: function() {},
                close: function() {}
              };

              setTimeout(function() {
                var openEvt = new Event('open');
                if (typeof dummySocket.onopen === 'function') dummySocket.onopen(openEvt);
                target.dispatchEvent(openEvt);
              }, 0);

              return dummySocket;
            }

            return new NativeWebSocket(url, protocols);
          };

          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args.some(function(arg) {
            var str = (arg && (arg.message || arg.stack || String(arg))) || '';
            return str.indexOf('WebSocket closed without opened') !== -1 || str.indexOf('[vite] connecting...') !== -1;
          })) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('WebSocket closed without opened') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? (e.reason.message || e.reason.stack || String(e.reason)) : '';
          if (reason.indexOf('WebSocket closed without opened') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
